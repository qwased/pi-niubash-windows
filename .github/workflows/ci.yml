name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run unit tests
        run: npm test

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dev dependencies
        # The repository does not commit a lockfile; `--include=dev` is required because a local
        # `npm config omit=dev` would otherwise leave `tsc` missing.
        run: npm install --include=dev --no-package-lock --no-audit --no-fund
      - name: Assert the local TypeScript compiler
        # Never rely on `npx tsc`: it can fetch the unrelated `tsc` npm package, print a banner and
        # exit successfully without checking anything.
        run: node -e "const { version } = require('typescript'); if (!version) process.exit(1); console.log('typescript', version)"
      - name: Typecheck
        run: npm run typecheck
